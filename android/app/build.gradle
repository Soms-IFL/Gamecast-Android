plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iflgamecast.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.iflgamecast.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    buildTypes {
        release {
            // Shrink only (no obfuscation/optimisation), signed with the debug key so it installs directly.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }

    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'io.coil-kt:coil-svg:2.6.0'

    // Material colour utilities: builds a full M3 colour scheme from a single seed colour (my-team theming)
    implementation 'com.google.android.material:material:1.12.0'

    // Embedded JavaScript engine that runs the IFL game engine (the same one the website uses) for live viewing and replays
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'   // real org.json for JVM tests (Android's is stubbed there)
}
