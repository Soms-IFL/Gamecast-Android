<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFL Gamecast</title>
<meta name="description" content="Scores, live play-by-play, standings and stats for the IFL.">
<meta name="theme-color" content="#f6f5fb" id="theme-color">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without blocking the app (media=print + onload swap) -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top-bar" id="top-bar">
    <div class="title">
      <img class="logo-img" src="logo.png" alt="IFL">
      <h1 class="page-title" id="page-title">Gamecast</h1>
    </div>
    <span class="conn" id="conn" hidden></span>
    <button class="icon-btn sl" id="btn-season" aria-label="Choose season"><span class="ms">history</span></button>
    <button class="icon-btn sl" id="btn-settings" aria-label="Settings"><span class="ms">settings</span></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="nav-bar" id="nav" aria-label="Main"></nav>
</div>
<div id="overlay"></div>
<noscript><p style="padding:24px">IFL Gamecast needs JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
